[dev]
  framework = "astro"
  command = "astro dev"
  targetPort = 4321
  autoLaunch = false

[build]
  publish = "dist"

# HTML pages: allow CDN to cache but always revalidate on deploy.
# Hashed assets (_astro/*): immutable — filenames change when content changes.
[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# ── Environment variables ──────────────────────────────────────────────────────
#
# BUILD-TIME (GitHub Actions secrets — GitHub → Settings → Secrets and variables → Actions)
#
#   These are baked into the HTML by `astro build` and must be present during
#   the CI build job. Add them as repository secrets, then the ci.yml `build`
#   step passes them via `env:`.
#
#   PUBLIC_STRIPE_PUBLISHABLE_KEY  Stripe publishable key (pk_live_… or pk_test_…)
#                                  Controls whether the tip/support button renders
#   PUBLIC_POSTHOG_KEY             PostHog project API key
#   PUBLIC_POSTHOG_HOST            PostHog ingest host, e.g. https://eu.i.posthog.com
#
# ──────────────────────────────────────────────────────────────────────────────
#
# RUNTIME (Netlify → Site configuration → Environment variables)
#
#   These are read by Netlify functions at request time and never embedded in
#   the built HTML. Keep them in the Netlify dashboard only.
#
# Shared
#   SITE_URL                  Public URL of the site, e.g. https://sourcier.uk
#   NETLIFY_PAT               Personal access token — https://app.netlify.com/user/applications
#                             NOTE: do NOT use NETLIFY_ACCESS_TOKEN — Netlify auto-injects that name
#                             at runtime with a limited site-scoped machine token, overwriting yours
#   RESEND_API_KEY            API key from https://resend.com
#                             (free tier: 3 000 emails/month)
#   NOTIFY_FROM_EMAIL         Verified Resend sender address, e.g. noreply@sourcier.uk
#
# Comment approval system (comment-handler, approve-comment, get-comments)
#   APPROVED_COMMENTS_FORM_ID Form ID for the "approved-comments" form.
#                             Visible in the Netlify Forms dashboard URL after
#                             the first comment is approved.
#   APPROVAL_SECRET           Random secret for HMAC-signing approve/delete links.
#                             Generate with: openssl rand -hex 32
#   NOTIFY_EMAIL              Address to receive comment notifications
#
# Reactions (reactions)
#   NETLIFY_SITE_ID           Site ID from Netlify → Site configuration → General
#
# Mailing list (subscribe)
#   RESEND_SEGMENT_ID         Audience segment ID from the Resend dashboard
#   RESEND_WELCOME_TEMPLATE_ID Resend broadcast template ID for the welcome email
#
# Support / one-time payments (support-checkout-session)
#   STRIPE_SECRET_KEY         Stripe secret key (sk_live_… or sk_test_…)
#
# Preview authentication (preview-auth edge function)
#   PREVIEW_PASSCODE          Passcode protecting draft/scheduled post previews
#
# Scheduled publish trigger (trigger-scheduled-publish)
#   GITHUB_PAT                Existing GitHub PAT (needs Actions "read and write"
#                              on sourcier/sourcier.uk, or classic "public_repo"
#                              scope) used to dispatch the CI workflow daily.
#
# One-time Netlify dashboard setup:
#   Forms → blog-comments → Form notifications → Add notification
#   → Outgoing webhook → URL: https://{your-site}/.netlify/functions/comment-handler
# ──────────────────────────────────────────────────────────────────────────────
