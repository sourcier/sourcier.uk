name: Run Visual Regression
description: Install Playwright browsers and run visual regression tests

inputs:
  report_name:
    description: Artifact name for the uploaded diff report (must be unique per workflow run)
    required: false
    default: visual-regression-report

runs:
  using: composite
  steps:
    - name: Cache Playwright browsers
      id: pw-cache
      # Skip when running inside the Playwright Docker container — browsers are
      # pre-installed at /ms-playwright and the caller sets PLAYWRIGHT_BROWSERS_PATH.
      if: ${{ env.PLAYWRIGHT_BROWSERS_PATH != '/ms-playwright' }}
      uses: actions/cache@v5
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

    - name: Install Playwright browsers
      if: ${{ env.PLAYWRIGHT_BROWSERS_PATH != '/ms-playwright' && steps.pw-cache.outputs.cache-hit != 'true' }}
      shell: bash
      run: pnpm exec playwright install chromium webkit --with-deps

    - name: Run visual regression tests
      shell: bash
      run: |
        # Skip comparison if no baselines exist yet for this platform/arch
        ARCH_FOLDER=$(node -e "process.stdout.write(process.platform + '-' + process.arch)")
        BASELINE_COUNT=$(find src/e2e/__snapshots__ -path "*/${ARCH_FOLDER}/*.png" 2>/dev/null | wc -l | tr -d ' ')
        if [ "$BASELINE_COUNT" = "0" ]; then
          echo "No baselines found — run 'pnpm test:visual:update' locally to generate them."
          exit 0
        fi
        pnpm exec playwright test

    - name: Write job summary
      if: always()
      shell: bash
      run: |
        echo "## Visual Regression" >> "$GITHUB_STEP_SUMMARY"
        echo "" >> "$GITHUB_STEP_SUMMARY"

        if [ ! -f test-results.json ]; then
          echo "⏭️ No baselines found — tests skipped." >> "$GITHUB_STEP_SUMMARY"
          exit 0
        fi

        passed=$(jq '.stats.expected' test-results.json)
        failed=$(jq '.stats.unexpected' test-results.json)
        skipped=$(jq '.stats.skipped' test-results.json)
        flaky=$(jq '.stats.flaky' test-results.json)
        total=$((passed + failed + skipped + flaky))

        if [ "$failed" -eq 0 ]; then
          echo "🟢 All tests passed" >> "$GITHUB_STEP_SUMMARY"
        else
          echo "🔴 $failed test(s) failed" >> "$GITHUB_STEP_SUMMARY"
        fi

        echo "" >> "$GITHUB_STEP_SUMMARY"
        echo "| ✅ Passed | ❌ Failed | ⏭️ Skipped | 🔄 Flaky | Total |" >> "$GITHUB_STEP_SUMMARY"
        echo "| --- | --- | --- | --- | --- |" >> "$GITHUB_STEP_SUMMARY"
        echo "| $passed | $failed | $skipped | $flaky | $total |" >> "$GITHUB_STEP_SUMMARY"

        if [ "$failed" -gt 0 ]; then
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Failed Tests" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          jq -r '[.. | objects | select(has("specs")) | .specs[] | . as $spec | .tests[] | select(.status == "unexpected") | "- **\(.projectName)** — \($spec.title)"] | unique[]' test-results.json >> "$GITHUB_STEP_SUMMARY"
        fi

    - name: Upload diff report
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.report_name }}
        path: reports/playwright/
        retention-days: 7
