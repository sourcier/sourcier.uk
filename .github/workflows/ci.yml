name: CI
run-name: >-
  ${{ github.event_name == 'repository_dispatch' && format('[content] {0}', github.event.client_payload.commit_message) ||
      github.event_name == 'pull_request' && format('[pr] {0}', github.event.pull_request.title) ||
      github.event_name == 'workflow_dispatch' && format('[manual:{0}] {1} by @{2}', inputs.environment, github.ref_name, github.actor) ||
      format('[push] {0}', github.event.head_commit.message) }}

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  repository_dispatch:
    types: [content-updated]
  # Daily scheduled publish is triggered by a Netlify Scheduled Function
  # (netlify/functions/trigger-scheduled-publish.ts) calling the
  # workflow_dispatch API below, rather than an on.schedule cron — GitHub
  # Actions gives no SLA on schedule triggers and can silently delay or drop
  # them (observed multi-hour delays / missed days on this repo).
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to build & deploy (branch is chosen via the "Use workflow from" ref picker above)
        type: choice
        options: [prod, preview]
        default: prod

concurrency:
  # All PRs share one group so opening/pushing to any PR cancels other PRs'
  # in-flight runs — they'd otherwise race to deploy the same preview alias.
  # Push/dispatch events keep their own ref-scoped group as before.
  group: >-
    ${{ github.workflow }}-${{ github.event_name == 'pull_request' && 'pull_request' || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Format, Lint & Test
    if: ${{ !contains(github.event.head_commit.message, '#skip-ci') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup

      - run: pnpm format:check

      - run: pnpm lint

      - run: pnpm typecheck:functions

      - run: pnpm test

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [quality, build-preview, visual-regression-preview]
    # Production build only — PRs are covered by build-preview instead, avoiding
    # a redundant full build (content fetch, assets, functions) on every PR push.
    # Waits on the preview build+visual-regression chain first: no point spending
    # prod build minutes if the same commit already failed for preview. Preview
    # doesn't run at all on workflow_dispatch(prod) — used for both manual and
    # scheduled publish runs — where both report 'skipped' rather than
    # 'success' — checking both explicitly (rather than
    # just the last job in the chain) so a real build-preview failure, which
    # also leaves visual-regression-preview 'skipped', still blocks prod.
    if: |
      always() &&
      !contains(github.event.head_commit.message, '#skip-ci') &&
      github.event_name != 'pull_request' &&
      (github.event_name != 'workflow_dispatch' || inputs.environment == 'prod') &&
      needs.quality.result == 'success' &&
      (needs['build-preview'].result == 'success' || needs['build-preview'].result == 'skipped') &&
      (needs['visual-regression-preview'].result == 'success' || needs['visual-regression-preview'].result == 'skipped')
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup

      - name: Fetch content
        run: pnpm build:content:fetch
        env:
          GH_PAT: ${{ secrets.GH_PAT }}

      - run: pnpm assets:sync

      - run: pnpm build
        env:
          SHOW_DRAFTS: "false"
          PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.PUBLIC_STRIPE_PUBLISHABLE_KEY }}
          PUBLIC_POSTHOG_KEY: ${{ secrets.PUBLIC_POSTHOG_KEY }}
          PUBLIC_POSTHOG_HOST: ${{ secrets.PUBLIC_POSTHOG_HOST }}

      # Serves the deployed commit at /version, matching the short SHA GitHub
      # displays in the UI, so a live site can be checked against what's
      # expected without digging through CI/deploy logs.
      - name: Write version file
        run: echo "${GITHUB_SHA:0:7}" > dist/version

      - run: pnpm build:search

      - name: Bundle Netlify functions
        run: pnpm build:functions

      - name: Upload built site
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist
          retention-days: 1

      - name: Upload bundled functions
        uses: actions/upload-artifact@v7
        with:
          name: functions
          path: .netlify/functions-built
          retention-days: 1

  build-preview:
    name: Build (preview)
    runs-on: ubuntu-latest
    needs: [quality]
    # Refreshes the stable preview alias: on every PR push (to verify changes before
    # merging), on every main push (so preview reflects the latest main once merged),
    # and on manual dispatch when the preview environment is selected.
    if: |
      !contains(github.event.head_commit.message, '#skip-ci') &&
      (github.event_name == 'pull_request' ||
       (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
       (github.event_name == 'workflow_dispatch' && inputs.environment == 'preview'))
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup

      - name: Fetch content
        run: pnpm build:content:fetch
        env:
          GH_PAT: ${{ secrets.GH_PAT }}

      - run: pnpm assets:sync

      - run: pnpm build
        env:
          SHOW_DRAFTS: "true"
          PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.PUBLIC_STRIPE_PUBLISHABLE_KEY }}
          PUBLIC_POSTHOG_KEY: ${{ secrets.PUBLIC_POSTHOG_KEY }}
          PUBLIC_POSTHOG_HOST: ${{ secrets.PUBLIC_POSTHOG_HOST }}

      # Serves the deployed commit at /version, matching the short SHA GitHub
      # displays in the UI, so a live site can be checked against what's
      # expected without digging through CI/deploy logs.
      - name: Write version file
        run: echo "${GITHUB_SHA:0:7}" > dist/version

      - run: pnpm build:search

      - name: Bundle Netlify functions
        run: pnpm build:functions

      - name: Upload built site
        uses: actions/upload-artifact@v7
        with:
          name: dist-preview
          path: dist
          retention-days: 1

      - name: Upload bundled functions
        uses: actions/upload-artifact@v7
        with:
          name: functions-preview
          path: .netlify/functions-built
          retention-days: 1

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: [build, visual-regression]
    if: |
      always() &&
      needs.build.result == 'success' &&
      (needs['visual-regression'].result == 'success' || needs['visual-regression'].result == 'skipped') &&
      github.event_name != 'pull_request'
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup

      - name: Download built site
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - name: Download bundled functions
        uses: actions/download-artifact@v8
        with:
          name: functions
          path: .netlify/functions-built

      - name: Resolve deploy message
        env:
          RAW_MSG: >-
            ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.commit_message ||
                github.event_name == 'pull_request' && github.event.pull_request.title ||
                github.event_name == 'workflow_dispatch' && format('[manual:{0}] triggered by @{1}', inputs.environment, github.actor) ||
                github.event.head_commit.message }}
        run: echo "DEPLOY_MSG=$(echo "$RAW_MSG" | head -1)" >> "$GITHUB_ENV"

      - name: Deploy to Netlify (production)
        if: github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && inputs.environment == 'prod')
        run: |
          OUTPUT=$(pnpm netlify deploy --dir=dist --functions .netlify/functions-built --prod --no-build --message "$DEPLOY_MSG" --json)
          echo "DEPLOY_URL=$(echo "$OUTPUT" | jq -r '.deploy_url')" >> $GITHUB_ENV
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}

      - name: Smoke test functions
        run: |
          BASE="$DEPLOY_URL/.netlify/functions"
          fail=0
          rows=""

          check() {
            local name="$1" url="$2" method="${3:-GET}"
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X "$method" "$url")
            if [ "$STATUS" = "502" ] || [ "$STATUS" = "000" ]; then
              echo "FAIL [$name] HTTP $STATUS — $url"
              rows="$rows| ❌ | \`$name\` | $STATUS |\n"
              fail=1
            else
              echo "OK   [$name] HTTP $STATUS"
              rows="$rows| ✅ | \`$name\` | $STATUS |\n"
            fi
          }

          check "reactions"                "$BASE/reactions?post=smoke-test"
          check "get-comments"             "$BASE/get-comments?slug=smoke-test"
          check "support-checkout-session" "$BASE/support-checkout-session" "OPTIONS"
          check "subscribe"                "$BASE/subscribe" "OPTIONS"

          {
            echo "## Function Smoke Tests"
            echo ""
            echo "| | Function | HTTP |"
            echo "| --- | --- | --- |"
            printf "$rows"
          } >> "$GITHUB_STEP_SUMMARY"

          exit $fail

  deploy-preview:
    name: Deploy (preview)
    runs-on: ubuntu-latest
    needs: [build-preview, visual-regression-preview]
    # Dependabot PRs only bump lockfile deps — skip the preview deploy (and the
    # lighthouse-preview job that depends on it below) since there's nothing
    # user-facing to preview or audit.
    if: |
      always() &&
      needs.build-preview.result == 'success' &&
      (needs['visual-regression-preview'].result == 'success' || needs['visual-regression-preview'].result == 'skipped') &&
      github.actor != 'dependabot[bot]'
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup

      - name: Download built site
        uses: actions/download-artifact@v8
        with:
          name: dist-preview
          path: dist

      - name: Download bundled functions
        uses: actions/download-artifact@v8
        with:
          name: functions-preview
          path: .netlify/functions-built

      - name: Resolve deploy message
        env:
          RAW_MSG: >-
            ${{ github.event_name == 'pull_request' && github.event.pull_request.title ||
                github.event.head_commit.message }}
        run: echo "DEPLOY_MSG=$(echo "$RAW_MSG" | head -1)" >> "$GITHUB_ENV"

      # Alias keeps the URL stable (preview--sourcieruk.netlify.app) across every deploy,
      # whether it's refreshing to match main or verifying an in-flight PR branch.
      # Note: --context only affects build-time env resolution, irrelevant here since
      # we deploy a pre-built dist with --no-build. Functions-scope vars (e.g.
      # PREVIEW_PASSCODE) must be scoped in the Netlify dashboard to cover this deploy.
      # Do NOT call the restoreSiteDeploy API here — it makes the given deploy the
      # site's live production deploy, not just the alias, which would clobber prod.
      - name: Deploy to Netlify (preview alias)
        run: |
          OUTPUT=$(pnpm netlify deploy --dir=dist --functions .netlify/functions-built --alias=preview --no-build --message "$DEPLOY_MSG" --json)
          echo "DEPLOY_URL=$(echo "$OUTPUT" | jq -r '.deploy_url')" >> $GITHUB_ENV
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}

      # Works around https://github.com/netlify/cli/issues/1984: once a "preview"
      # branch-deploy record exists, it never rolls forward to newer `--alias=preview`
      # deploys on its own — the alias keeps serving whatever deploy it's pinned to,
      # indefinitely. Deleting that pinned deploy after every deploy forces Netlify to
      # fall through to the most recent one (the deploy just made above), so the alias
      # can never go stale again. Safe to run unconditionally: the pinned deploy is
      # always the *previous* cycle's leftover — Netlify doesn't pin the new deploy
      # until the old one is gone.
      - name: Clear stale preview branch-deploy pointer
        run: |
          STALE_ID=$(pnpm netlify api listSiteDeployedBranches --data "{\"site_id\":\"$NETLIFY_SITE_ID\"}" | jq -r '.[] | select(.name == "preview") | .deploy_id')
          if [ -n "$STALE_ID" ]; then
            pnpm netlify api deleteSiteDeploy --data "{\"site_id\":\"$NETLIFY_SITE_ID\",\"deploy_id\":\"$STALE_ID\"}"
          fi
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}

      - name: Comment preview link on PR
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr comment "${{ github.event.pull_request.number }}" \
            --repo "${{ github.repository }}" \
            --edit-last --create-if-none \
            --body "🔍 Preview: $DEPLOY_URL"

  lighthouse:
    name: Lighthouse (${{ matrix.form_factor }})
    needs: deploy
    if: github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && inputs.environment == 'prod')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - form_factor: mobile
          - form_factor: desktop
            configPath: .github/lighthouse/desktop.json
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/lighthouse
        with:
          form_factor: ${{ matrix.form_factor }}
          configPath: ${{ matrix.configPath }}
          base_url: https://sourcier.uk
          environment: prod

  lighthouse-preview:
    name: Lighthouse Preview (${{ matrix.form_factor }})
    needs: deploy-preview
    # deploy-preview is skipped for dependabot PRs, so this is too.
    if: always() && needs.deploy-preview.result == 'success' && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - form_factor: mobile
          - form_factor: desktop
            configPath: .github/lighthouse/desktop.json
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/lighthouse
        with:
          form_factor: ${{ matrix.form_factor }}
          configPath: ${{ matrix.configPath }}
          base_url: https://preview--sourcieruk.netlify.app
          preview_passcode: ${{ secrets.PREVIEW_PASSCODE }}
          environment: preview

  visual-regression:
    name: Visual Regression
    runs-on: ubuntu-latest
    needs: build
    # Gates the prod deploy against the exact prod build (SHOW_DRAFTS=false).
    if: |
      always() &&
      !contains(github.event.head_commit.message, '#skip-ci') &&
      (github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch') &&
      needs.build.result == 'success'
    # Pin to the same Playwright Docker image used by the update-visual-baselines
    # workflow so font rendering matches the stored linux-x64 baselines.
    container:
      image: mcr.microsoft.com/playwright:v1.59.1-noble
      options: --ipc=host
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      # jq is not included in the Playwright Docker image
      - run: apt-get update && apt-get install -y jq
        shell: bash

      # Node.js is provided by the Playwright container; setup is only used for pnpm caching.
      - uses: ./.github/actions/setup

      - name: Download built site
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - uses: ./.github/actions/visual-regression

  visual-regression-preview:
    name: Visual Regression (preview)
    runs-on: ubuntu-latest
    needs: build-preview
    # Gates the preview deploy against the exact preview build (SHOW_DRAFTS=true).
    if: |
      always() &&
      !contains(github.event.head_commit.message, '#skip-ci') &&
      (github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch') &&
      needs['build-preview'].result == 'success'
    # Pin to the same Playwright Docker image used by the update-visual-baselines
    # workflow so font rendering matches the stored linux-x64 baselines.
    container:
      image: mcr.microsoft.com/playwright:v1.59.1-noble
      options: --ipc=host
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      # jq is not included in the Playwright Docker image
      - run: apt-get update && apt-get install -y jq
        shell: bash

      # Node.js is provided by the Playwright container; setup is only used for pnpm caching.
      - uses: ./.github/actions/setup

      - name: Download built site
        uses: actions/download-artifact@v8
        with:
          name: dist-preview
          path: dist

      - uses: ./.github/actions/visual-regression
        with:
          report_name: visual-regression-report-preview
