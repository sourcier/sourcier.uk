name: Update Visual Baselines
run-name: Update linux-x64 visual regression baselines

# Manual only — regenerating baselines should be a deliberate, reviewed action,
# not something that runs automatically on every failure.
on:
  workflow_dispatch:

jobs:
  update-baselines:
    name: Update Baselines
    runs-on: ubuntu-latest
    # Same image the visual-regression CI job checks against, so the baselines
    # this workflow produces are valid for that comparison.
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --ipc=host
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup

      - name: Fetch content
        uses: actions/checkout@v6
        with:
          repository: sourcier/sourcier.uk-content
          ref: main
          path: collections/posts
          token: ${{ secrets.GH_PAT }}
          persist-credentials: false

      - name: Remove content repository metadata
        run: rm -rf collections/posts/.git

      # rsync/jq are not included in the Playwright Docker image — rsync is used by
      # assets:sync, jq to safely build the PR JSON body (gh CLI isn't installed either)
      - run: apt-get update && apt-get install -y rsync jq
        shell: bash

      - run: pnpm assets:sync

      - run: pnpm build
        env:
          SHOW_DRAFTS: "false"
          PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.PUBLIC_STRIPE_PUBLISHABLE_KEY }}
          PUBLIC_POSTHOG_KEY: ${{ secrets.PUBLIC_POSTHOG_KEY }}
          PUBLIC_POSTHOG_HOST: ${{ secrets.PUBLIC_POSTHOG_HOST }}

      - run: pnpm build:search

      - name: Regenerate baselines
        run: pnpm exec playwright test --update-snapshots

      - name: Open PR with updated baselines
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE_BRANCH: ${{ github.ref_name }}
        run: |
          # actions/checkout only registers safe.directory under a temporary
          # $HOME used during its own step — it doesn't persist to later steps
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

          # Stage first: git diff (unlike status) ignores untracked files, which
          # would silently miss brand-new baselines (e.g. the first linux-x64 run)
          git add src/e2e/__snapshots__
          if git diff --cached --quiet; then
            echo "No baseline changes — nothing to do."
            exit 0
          fi

          BRANCH="update-visual-baselines-$(date +%s)"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git commit -m "chore(e2e): update linux-x64 visual regression baselines"
          git push origin "$BRANCH"

          # gh CLI isn't installed in the Playwright image — call the REST API directly
          jq -n --arg title "chore(e2e): update linux-x64 visual regression baselines" \
                --arg body "Automated baseline refresh from the Update Visual Baselines workflow. Review the image diffs before merging." \
                --arg head "$BRANCH" \
                --arg base "$BASE_BRANCH" \
                '{title: $title, body: $body, head: $head, base: $base}' \
            | curl -sS -X POST \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/${{ github.repository }}/pulls" \
                -d @- \
                --fail-with-body
