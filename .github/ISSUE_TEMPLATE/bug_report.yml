name: Bug report
description: Report a reproducible problem with the site.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Report vulnerabilities [privately](https://github.com/sourcier/sourcier.uk/security/advisories/new), not here.
        Do not include credentials, private content, payment details, or personal data.
        Check existing issues before submitting a new report.
  - type: input
    id: page
    attributes:
      label: Affected page or feature
      description: Share a public page URL without private query parameters, or name the feature.
      placeholder: https://sourcier.uk/blog
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Describe the smallest sequence that demonstrates the problem.
      placeholder: |
        1. Open the page.
        2. Select ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      description: What should happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: What happens instead? Include redacted error messages if relevant.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser and device
      description: Include browser version, operating system, and device type if relevant.
      placeholder: Safari, version ..., macOS, desktop
    validations:
      required: true
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots and additional context
      description: Optional. Remove secrets and personal data before attaching images or logs.
